name: Site Monitor

on:
  schedule:
    - cron: '20 * * * *'   # har ghante
  workflow_dispatch:

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install firebase-admin@12
      - name: Site monitor
        run: node monitor.js
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_MONITOR: ${{ secrets.NTFY_TOPIC_MONITOR }}   # optional: site alerts ke liye alag topic
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
