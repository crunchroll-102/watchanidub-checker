name: Video Link Checker

on:
  schedule:
    - cron: '20 * * * *'   # har ghante chalta hai: site monitor har dafa, poora link check din mein 4 baar
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Sirf ek link test karna ho to yahan paste karein (warna khali)'
        required: false
        default: ''
      force:
        description: 'Abhi dobara poora link check (true / false)'
        required: false
        default: 'false'

concurrency:
  group: link-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install firebase-admin@12
      - name: Site monitor
        if: ${{ github.event.inputs.test_url == '' || github.event.inputs.test_url == null }}
        continue-on-error: true
        run: node monitor.js
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: AniList alerts
        if: ${{ github.event.inputs.test_url == '' || github.event.inputs.test_url == null }}
        continue-on-error: true
        run: node anilist.js
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DIGEST: 'true'             # roz sham mashhoor aane wali anime ki list ('false' = band)
      - name: Run checker
        run: node checker.js
        env:
          BLOG_URL: ${{ secrets.BLOG_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RUN_MINUTES: '40'
          START_HOURS: '0,9,15,20'   # raat 12, subah 9, sham 3, raat 8 (Pakistan time)
          TEST_URL: ${{ github.event.inputs.test_url }}
          FORCE: ${{ github.event.inputs.force }}
