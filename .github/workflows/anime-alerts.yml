name: Anime Release Alerts

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # har 15 minute (:07 se, taake ghante ke shuru ka rush na ho)
  workflow_dispatch:

concurrency:
  group: anime-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install firebase-admin@12

      - name: Anime release alerts (sub)
        continue-on-error: true
        run: node anilist.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}          # optional, khali bhi chalega
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PRE_MIN: '60'          # episode se kitne minute pehle alert
          SCHEDULE_AHEAD_H: '3'  # 1-ghanta alert kitne ghante pehle ntfy par schedule ho
          PRE_POP: '2000'        # 1 ghanta pehle alert: sirf itni popularity se upar (0 = SAB anime)
          ALERT_POP: '2000'      # release par "Abhi aaya" alert (-1 = band, 0 = SAB anime)
          WEEK_POP: '5000'       # 7 din pehle nayi anime ka alert
          MIN_POP: '0'           # raat ki list + 1 din pehle nayi anime (0 = SAB anime)
          DIGEST_HOUR: '20'      # kal ki list raat 8 baje (PK)
          NEWS: 'true'           # nayi announcements ('false' = band)

      - name: Dub alerts (English + Hindi)
        continue-on-error: true
        run: node dub.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          PRE_MIN: '60'          # English dub episode se kitne minute pehle alert
          SCHEDULE_AHEAD_H: '3'
          DIGEST_HOUR: '20'      # kal ki dub list raat 8 baje (PK)
          HINDI_NEWS: 'true'     # Hindi dub ki khabrein ('false' = band)
          HINDI_PRIORITY: 'default'
